<html>

        margin: 0;

      }

      #odontogramaArea {
        width: fit-content;
        max-width: 100%;
        margin: 0 auto;
        padding-top: 36px;
        box-sizing: border-box;
        overflow: visible;
      }

      .odontograma-grid {
        width: auto !important;
        margin: 0 auto;
        overflow: visible;
      }

      .odontograma-quadrant {
        overflow: visible;
      }
    </style>
  </head>

  <body>
    <div id="odontogramaArea" class="odontograma-area"></div>

    <script>
      /* ================================
        DATA INYECTADA DESDE NODE
      ================================ */

      /* ================================
        CONSTANTES
      ================================ */

        "16",
        "15",
        "14",
        "13",
        "12",
        "11",
        "21",
        "22",
        "23",

        "25",

        "41",
        "31",

        "33",
        "34",
        "35",
        "36",
        "37",
        "38",
      ];

      var NINO_COORDS = [
        "55",
        "54",
        "53",
        "52",
        "51",
        "61",
        "62",
        "63",
        "64",
        "65",

        "83",

      /* ================================
        HELPERS
      ================================ */

      function applyRegionMixed($reg) {
        try {
          var region = $reg.attr("data-region") || $reg.data("region");
          var gid = mapRegionToGradientId(region);
          // set SVG fill to gradient and add marker class
          // apply as inline style to ensure gradient is used (overrides stylesheet)
          $reg.css("fill", "url(#" + gid + ")");
          $reg.addClass("mark-mixed");
        } catch (e) {
          console.warn("applyRegionMixed error", e);
        }
      }

      function setCariesSize($reg, size) {
        $reg.removeClass("caries-size-1 caries-size-2 caries-size-3");
        if (size === 1) $reg.addClass("caries-size-1");
        else if (size === 2) $reg.addClass("caries-size-2");
        else if (size === 3) $reg.addClass("caries-size-3");
      }

      function isDiagonalDamage(dano) {
        var d = (dano || "").toString().toLowerCase();
        return (
          d === "diag_parcial" ||
          d === "parcial_diag" ||
          d === "linea_diagonal" ||
          d === "fractura" ||
          d === "fractura_linea" ||
          d.indexOf("diag_parc") === 0
        );
      }

      function isCariesCircleDamage(dano) {
        var d = (dano || "").toString().toLowerCase();
        return d.indexOf("caries") === 0 || d.indexOf("carie") === 0;
      }

      function parseCariesCircleSizeFromDamage(dano) {
        var d = (dano || "").toString().toLowerCase();
        var m = d.match(/cari(?:e|es)\D*([123])/i);
        if (m && m[1]) return parseInt(m[1], 10);
        return 3;
      }

      function clearDiagonalMark($tooth, region) {
        if (!$tooth || !region) return;
        $tooth
          .find(".diag-partial-" + region)
          .removeClass("mark-blue mark-red mark-mixed");
      }

      function setDiagonalMark($tooth, region, color) {
        if (!$tooth || !region) return;
        clearDiagonalMark($tooth, region);
        var $line = $tooth.find(".diag-partial-" + region);
        if (!$line.length) return;
        if (color === "mixed") $line.addClass("mark-mixed");
        else if (color === "red") $line.addClass("mark-red");
        else $line.addClass("mark-blue");
      }

      function clearCariesCircleMark($tooth, region) {
        if (!$tooth || !region) return;
        $tooth
          .find(".caries-core-" + region + ", .caries-ring-" + region)
          .removeClass("mark-blue mark-red mark-mixed caries-size-1 caries-size-2 caries-size-3");
      }

      function setCariesCircleSize($tooth, region, size) {
        if (!$tooth || !region) return;
        var $els = $tooth.find(
          ".caries-core-" + region + ", .caries-ring-" + region,
        );
        $els.removeClass("caries-size-1 caries-size-2 caries-size-3");
        if (size === 1) $els.addClass("caries-size-1");
        else if (size === 2) $els.addClass("caries-size-2");
        else $els.addClass("caries-size-3");
      }

      function setCariesCircleMark($tooth, region, color) {
        if (!$tooth || !region) return;
        clearCariesCircleMark($tooth, region);
        var $core = $tooth.find(".caries-core-" + region);
        var $ring = $tooth.find(".caries-ring-" + region);
        if (!$core.length || !$ring.length) return;
        if (color === "mixed") {
          $core.addClass("mark-blue");
          $ring.addClass("mark-red");
        } else if (color === "red") {
          $core.addClass("mark-red");
        } else {
          $core.addClass("mark-blue");
        }
      }

      /* ================================
        APLICAR DAÑOS
      ================================ */

      function renderOdontoFromConsulta(arr) {
        if (!Array.isArray(arr) || !arr.length) {
          $("#odontogramaArea").empty();
          return;
        }
        var countN = 0,
          countA = 0;
        arr.forEach(function (d) {
          var c = (d.coordenada || "").toString();
          if (NINO_COORDS.indexOf(c) !== -1) countN++;
          if (ADULT_COORDS.indexOf(c) !== -1) countA++;
        });
        var inferred = countN > countA ? "nino" : "adulto";
        // volver a renderizar odontograma con el tipo inferido
        renderOdontograma(inferred);

        arr.forEach(function (d) {
          try {
            const coord = String(d.coordenada || "");
            const dano = String(d.dano || "").toLowerCase();
            const color = String(d.color || "").toLowerCase();
            const ubic = String(d.ubicacion || "").toLowerCase();

            const $tooth = $("#odontogramaArea").find(
              '.tooth[data-tooth="' + coord + '"]',
            );

            if (!$tooth.length) return;

            const $svg = $tooth.find("svg");

            // =========================
            // EXTRACCIÓN / TOTAL
            // =========================
            if (dano.includes("extr")) {
              $tooth.addClass("extraction");

              if (color === "blue") $tooth.addClass("mark-blue");
              if (color === "red") $tooth.addClass("mark-red");
              if (color === "mixed") $tooth.addClass("mark-mixed");

              $tooth
                .find(".region")
                .removeClass("mark-blue mark-red mark-mixed")
                .removeAttr("fill")
                .css("fill", "");

              return;
            }

            // marca de verificación / check (acepta variantes)
            if (
              dano.indexOf("check") !== -1 ||
              dano.indexOf("overlay_check") !== -1 ||
              dano.indexOf("overlay-check") !== -1
            ) {
              $tooth.addClass("overlay-check");
              return;
            }

            // =========================
            // MARCAS TOTALES (SVG)
            // =========================
            if (dano === "center_lin") {
              if (color === "blue") {
                $svg.find(".center-line-inner").addClass("mark-blue");
              } else if (color === "red") {
                $svg.find(".center-line-outer").addClass("mark-red");
              } else if (color === "mixed") {
                $svg
                  .find(".center-line-inner, .center-line-outer")
                  .addClass("mark-mixed");
              }
              return;
            }

            if (dano === "outline") {
              if (color === "blue") {
                $svg.find(".outline-inner").addClass("mark-blue");
              } else if (color === "red") {
                $svg.find(".outline-outer").addClass("mark-red");
              } else if (color === "mixed") {
                $svg
                  .find(".outline-inner, .outline-outer")
                  .addClass("mark-mixed");
              }
              return;
            }

            if (dano === "bottom_lin") {
              if (color === "blue") {
                $svg.find(".bottom-line-inner").addClass("mark-blue");
              } else if (color === "red") {
                $svg.find(".bottom-line-outer").addClass("mark-red");
              } else if (color === "mixed") {
                $svg
                  .find(".bottom-line-inner, .bottom-line-outer")
                  .addClass("mark-mixed");
              }
              return;
            }

            if (dano === "overlay_s") {
              $tooth.addClass("overlay-s");

              if (color === "blue") {
                $tooth.addClass("mark-blue");
              } else if (color === "red") {
                $tooth.addClass("mark-red");
              } else if (color === "mixed") {
                $tooth.addClass("mark-mixed");
              }

              return;
            }

            // =========================
            // MARCAS POR REGIÓN
            // =========================
            let region = null;
            if (ubic.includes("sup")) region = "top";
            if (ubic.includes("inf")) region = "bottom";
            if (ubic.includes("izq")) region = "left";
            if (ubic.includes("der")) region = "right";
            if (ubic.includes("cen")) region = "center";

            if (!region) return;

            const $reg = $tooth.find('.region[data-region="' + region + '"]');
            if (!$reg.length) return;

            if (isDiagonalDamage(d.dano)) {
              $reg.removeClass("mark-blue mark-red mark-mixed").removeAttr("fill").css("fill", "");
              setCariesSize($reg, 0);
              clearCariesCircleMark($tooth, region);
              setDiagonalMark($tooth, region, color || "blue");
              return;
            }

            if (isCariesCircleDamage(d.dano)) {
              $reg.removeClass("mark-blue mark-red mark-mixed").removeAttr("fill").css("fill", "");
              setCariesSize($reg, 0);
              clearDiagonalMark($tooth, region);
              setCariesCircleMark($tooth, region, color || "blue");
              setCariesCircleSize($tooth, region, parseCariesCircleSizeFromDamage(d.dano));
              return;
            }

            // tamaño: por compatibilidad, si no viene tamaño, asumimos 3
            var size = 3;
            try {
              var danStr = (d.dano || "").toString().toLowerCase();
              var mm = danStr.match(/parcial\D*([123])/i);
              if (mm && mm[1]) size = parseInt(mm[1], 10);
            } catch (e) {}
            if (![1, 2, 3].includes(size)) size = 3;

            if (color === "blue") {
              $reg.addClass("mark-blue");
            } else if (color === "red") {
              $reg.addClass("mark-red");
            } else if (color === "mixed") {
              applyRegionMixed($reg);
            }
            // aplicar tamaño de caries (parcial)
            setCariesSize($reg, size);
          } catch (e) {
            console.warn("Error pintando odontograma (load)", e);
          }
        });

        // bloquear select de tipo si existe
        try {
          $("#tipo_dentadura").prop("disabled", true);
        } catch (e) {}
      }

              '  <circle class="caries-core caries-core-left" cx="40" cy="100" r="16"/>\n' +
              '  <circle class="caries-ring caries-ring-center" cx="100" cy="100" r="22"/>\n' +
              '  <circle class="caries-core caries-core-center" cx="100" cy="100" r="16"/>\n' +
              "  <!-- total marks placeholders -->\n" +
              '  <path class="center-line-inner" d="M98 135 L98 10" stroke-linecap="round" stroke-width="6" fill="none"/>\n' +
              '  <path class="center-line-outer" d="M102 135 L102 10" stroke-linecap="round" stroke-width="6" fill="none"/>\n' +
              '  <rect class="outline-inner" x="22" y="22" width="156" height="156" fill="none" stroke-width="6"/>\n' +
              '  <rect class="outline-outer" x="6" y="6" width="188" height="188" fill="none" stroke-width="6"/>\n' +
              '  <line class="bottom-line-inner" x1="10" y1="188" x2="190" y2="188" stroke-linecap="round" stroke-width="6"/>\n' +
              '  <line class="bottom-line-outer" x1="6" y1="192" x2="194" y2="192" stroke-linecap="round" stroke-width="6"/>\n' +
              "</svg>\n";
          }

          return $(
            '<div class="tooth" data-tooth="' +
              num +
              '">' +
              svg +
              '<div class="tooth-number">' +
              num +
              "</div>" +
              "</div>",
          );
        }

        ul.forEach(function (n) {
          $q1.append(makeTooth(n));
        });
        ur.forEach(function (n) {
          $q2.append(makeTooth(n));
        });
        ll.forEach(function (n) {
          $q3.append(makeTooth(n));
        });
        lr.forEach(function (n) {
          $q4.append(makeTooth(n));
        });

        var $table = $(
          '<table class="odontograma-grid" style="width:100%;border-collapse:collapse;">' +
            "<tbody>" +
            "<tr>" +
            '<td class="odontograma-corner" style="width:10%;"></td>' +
            '<td class="odontograma-header text-center" style="width:45%;font-weight:bold;">Derecho</td>' +
            '<td class="odontograma-header text-center" style="width:45%;font-weight:bold;">Izquierdo</td>' +
            "</tr>" +
            "<tr>" +
            '<td class="odontograma-side text-center" style="vertical-align:middle;font-weight:bold;">Superior</td>' +
            '<td class="odontograma-cell" style="vertical-align:top;padding:8px;"></td>' +
            '<td class="odontograma-cell" style="vertical-align:top;padding:8px;"></td>' +
            "</tr>" +
            "<tr>" +
            '<td class="odontograma-side text-center" style="vertical-align:middle;font-weight:bold;">Inferior</td>' +
            '<td class="odontograma-cell" style="vertical-align:top;padding:8px;"></td>' +
            '<td class="odontograma-cell" style="vertical-align:top;padding:8px;"></td>' +
            "</tr>" +
            "</tbody>" +
            "</table>",
        );

        // colocar los cuadrantes en las celdas correspondientes
        // UL -> row2 col2, UR -> row2 col3, LL -> row3 col2, LR -> row3 col3
        $table
          .find("tbody tr")
          .eq(1)
          .find("td.odontograma-cell")
          .eq(0)
          .append($q1);
        $table
          .find("tbody tr")
          .eq(1)
          .find("td.odontograma-cell")
          .eq(1)
          .append($q2);
        $table
          .find("tbody tr")
          .eq(2)
          .find("td.odontograma-cell")
          .eq(0)
          .append($q3);
        $table
          .find("tbody tr")
          .eq(2)
          .find("td.odontograma-cell")
          .eq(1)
          .append($q4);

        $area.append($table);
        adjustChildBottomLines();
      }

      function adjustChildBottomLines() {
        try {
          if (!$("#odontogramaArea").hasClass("tipo-nino")) return;
          var svgs = document.querySelectorAll("#odontogramaArea .tooth-svg");
          var ns = "http://www.w3.org/2000/svg";
          svgs.forEach(function (svg) {
            try {
              var inner = svg.querySelector(".bottom-line-inner");
              if (inner && inner.tagName.toLowerCase() === "line") {
                var p = document.createElementNS(ns, "path");
                p.setAttribute("class", inner.getAttribute("class"));
                p.setAttribute("d", "M163.6 163.6 A86 86 0 0 1 36.4 163.6");
                p.setAttribute(
                  "stroke-linecap",
                  inner.getAttribute("stroke-linecap") || "round",
                );
                p.setAttribute(
                  "stroke-width",
                  inner.getAttribute("stroke-width") ||
                    inner.getAttribute("stroke-width") ||
                    "6",
                );
                p.setAttribute("fill", "none");
                inner.parentNode.replaceChild(p, inner);
              }
              var outer = svg.querySelector(".bottom-line-outer");
              if (outer && outer.tagName.toLowerCase() === "line") {
                var p2 = document.createElementNS(ns, "path");
                p2.setAttribute("class", outer.getAttribute("class"));
                p2.setAttribute("d", "M166 166 A94 94 0 0 1 34 166");
                p2.setAttribute(
                  "stroke-linecap",
                  outer.getAttribute("stroke-linecap") || "round",
                );
                p2.setAttribute(
                  "stroke-width",
                  outer.getAttribute("stroke-width") || "6",
                );
                p2.setAttribute("fill", "none");
                outer.parentNode.replaceChild(p2, outer);
              }
            } catch (e) {
              console.warn("adjustChildBottomLines inner error", e);
            }
          });
        } catch (e) {
          console.warn("adjustChildBottomLines error", e);
        }
      }

      function mapRegionToGradientId(region) {
        if (!region) return "g_mixed_center";
        var r = region.toString().toLowerCase();
        if (r === "top") return "g_mixed_top";
        if (r === "bottom") return "g_mixed_bottom";
        if (r === "left") return "g_mixed_left";
        if (r === "right") return "g_mixed_right";
        if (r === "center") return "g_mixed_center";
        return "g_mixed_center";
      }

      $(function () {
        renderOdontoFromConsulta(DATA);

        // Señal para Puppeteer
        window.__RENDER_DONE__ = true;
      });
    </script>
