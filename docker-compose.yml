services:
  odontograma-render:
    build:
      context: .
      dockerfile: Dockerfile
    image: odonto/odontograma-render:latest
    container_name: odontograma_render
    ports:
      - "3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
